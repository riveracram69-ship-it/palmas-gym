    <rect x="1290" y="680" width="235" height="265" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="1407" y="704" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">expenses</text>
    <line x1="1290" y1="714" x2="1525" y2="714" stroke="#334155" stroke-width="1.2"/>

