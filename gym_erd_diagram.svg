    <text x="372" y="215" font-size="11" font-weight="700" fill="#0f172a">attendance_id [PK]</text>
    <text x="372" y="234" font-size="11" fill="#0f172a">member_id [FK]</text>
    <text x="372" y="253" font-size="11" fill="#0f172a">date</text>
    <text x="372" y="272" font-size="11" fill="#0f172a">time_in</text>
    <text x="372" y="291" font-size="11" fill="#0f172a">time_out</text>
