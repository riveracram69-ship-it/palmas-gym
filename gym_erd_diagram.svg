    <text x="1302" y="754" font-size="11" fill="#0f172a">expense_date</text>
    <text x="1302" y="773" font-size="11" fill="#0f172a">category</text>
    <text x="1302" y="792" font-size="11" fill="#0f172a">title</text>
    <text x="1302" y="811" font-size="11" fill="#0f172a">amount</text>
    <text x="1302" y="830" font-size="11" fill="#0f172a">payment_method</text>
    <text x="1302" y="849" font-size="11" fill="#0f172a">reference_number</text>
    <text x="1302" y="868" font-size="11" fill="#0f172a">receipt_photo</text>
    <text x="1302" y="887" font-size="11" fill="#0f172a">notes</text>
