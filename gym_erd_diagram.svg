<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 1220" width="100%" height="100%" style="background:#ffffff; font-family:'Consolas', 'Courier New', 'Lucida Console', monospace;">
  <defs>
    <!-- Background Grid Pattern (Exact Draw.io style) -->
    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>
    </pattern>

    <!-- Marker Definitions for Crow's Foot & Multiplicity -->
    <!-- 1. One and Only One (||) -->
    <marker id="one-one-start" viewBox="0 0 20 20" refX="2" refY="10" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <line x1="8" y1="3" x2="8" y2="17" stroke="#334155" stroke-width="1.6"/>
      <line x1="14" y1="3" x2="14" y2="17" stroke="#334155" stroke-width="1.6"/>
    </marker>

    <!-- 2. Zero to Many (o<) -->
    <marker id="crow-many-end" viewBox="0 0 24 20" refX="22" refY="10" markerWidth="14" markerHeight="14" orient="auto">
      <circle cx="6" cy="10" r="3.5" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
      <line x1="10" y1="10" x2="22" y2="10" stroke="#334155" stroke-width="1.5"/>
      <line x1="12" y1="3" x2="22" y2="10" stroke="#334155" stroke-width="1.5"/>
      <line x1="12" y1="17" x2="22" y2="10" stroke="#334155" stroke-width="1.5"/>
    </marker>

    <!-- 3. One to Many (| <) -->
    <marker id="one-many-end" viewBox="0 0 24 20" refX="22" refY="10" markerWidth="14" markerHeight="14" orient="auto">
      <line x1="6" y1="3" x2="6" y2="17" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="10" x2="22" y2="10" stroke="#334155" stroke-width="1.5"/>
      <line x1="12" y1="3" x2="22" y2="10" stroke="#334155" stroke-width="1.5"/>
      <line x1="12" y1="17" x2="22" y2="10" stroke="#334155" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect x="0" y="0" width="1850" height="1220" fill="url(#grid-pattern)"/>

  <!-- ================================================================= -->
  <!-- 1. MEMBERSHIP_PLANS (TOP LEFT)                                    -->
  <!-- ================================================================= -->
  <g id="tbl-membership_plans">
    <rect x="60" y="60" width="220" height="175" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="170" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">membership_plans</text>
    <line x1="60" y1="94" x2="280" y2="94" stroke="#334155" stroke-width="1.2"/>
    
    <text x="72" y="115" font-size="11" font-weight="700" fill="#0f172a">membership_plans_id [PK]</text>
    <text x="72" y="134" font-size="11" fill="#0f172a">name</text>
    <text x="72" y="153" font-size="11" fill="#0f172a">duration_months</text>
    <text x="72" y="172" font-size="11" fill="#0f172a">price</text>
    <text x="72" y="191" font-size="11" fill="#0f172a">benefits</text>
    <text x="72" y="210" font-size="11" fill="#0f172a">created_at</text>
  </g>

  <!-- ================================================================= -->
