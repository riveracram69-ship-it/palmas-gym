    <text x="1302" y="925" font-size="11" fill="#0f172a">created_at</text>
  </g>

  <!-- ================================================================= -->
  <!-- PRECISE ORTHOGONAL RELATIONSHIP LINES (CROW'S FOOT NOTATION)      -->
  <!-- ================================================================= -->
  <g stroke="#334155" stroke-width="1.4" fill="none">
    
    <!-- 1. membership_plans (1) -> subscriptions (Many) -->
    <path d="M 170 60 L 170 25 L 1370 25 L 1370 360" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 2. membership_plans (1) -> members (Many) -->
    <path d="M 280 180 L 460 180 L 460 380 L 640 380" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 3. members (1) -> attendance (Many) -->
    <path d="M 640 180 L 540 180" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 4. members (1) -> renewal_requests (Many) -->
    <path d="M 640 430 L 480 430 L 480 430 L 280 430" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 5. membership_plans (1) -> renewal_requests (Many) -->
    <path d="M 100 235 L 100 360" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 6. members (1) -> payments (Many) -->
    <path d="M 860 180 L 990 180" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 7. subscriptions (1) -> payments (Many) -->
    <path d="M 1270 420 L 1150 420 L 1150 365" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 8. members (1) -> subscriptions (Many) -->
    <path d="M 860 440 L 1270 440" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 9. users (1) -> members (Many / Approved) -->
    <path d="M 750 660 L 750 525" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 10. users (1) -> subscriptions (Many / Created) -->
    <path d="M 870 730 L 1220 730 L 1220 520 L 1270 520" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 11. users (1) -> payments (Many / Cashier) -->
    <path d="M 870 700 L 940 700 L 940 285 L 990 285" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 12. users (1) -> activity_logs (Many) -->
    <path d="M 870 770 L 980 770" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 13. users (1) -> renewal_requests (Many / Processed) -->
    <path d="M 630 750 L 30 750 L 30 550 L 60 550" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 14. members (1) -> notifications (Many) -->
    <path d="M 670 525 L 670 810 L 310 810" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 15. users (1) -> expenses (Many / Recorded) -->
    <path d="M 790 835 L 790 980 L 1400 980 L 1400 945" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 16. members (1) -> payment_transactions (Many) -->
    <path d="M 810 100 L 810 55 L 1660 55 L 1660 100" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>

    <!-- 17. membership_plans (1) -> payment_transactions (Many) -->
    <path d="M 280 120 L 590 120 L 590 75 L 1580 75 L 1580 100" marker-start="url(#one-one-start)" marker-end="url(#crow-many-end)"/>
  </g>

</svg>
