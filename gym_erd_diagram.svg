    <text x="750" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">members</text>
    <line x1="640" y1="134" x2="860" y2="134" stroke="#334155" stroke-width="1.2"/>

    <text x="652" y="155" font-size="11" font-weight="700" fill="#0f172a">member_id [PK]</text>
    <text x="652" y="174" font-size="11" fill="#0f172a">membership_id</text>
    <text x="652" y="193" font-size="11" fill="#0f172a">full_name</text>
    <text x="652" y="212" font-size="11" fill="#0f172a">email</text>
    <text x="652" y="231" font-size="11" fill="#0f172a">password_hash</text>
    <text x="652" y="250" font-size="11" fill="#0f172a">contact_number</text>
    <text x="652" y="269" font-size="11" fill="#0f172a">age</text>
    <text x="652" y="288" font-size="11" fill="#0f172a">gender</text>
    <text x="652" y="307" font-size="11" fill="#0f172a">photo</text>
    <text x="652" y="326" font-size="11" fill="#0f172a">account_status</text>
    <text x="652" y="345" font-size="11" fill="#0f172a">status</text>
    <text x="652" y="364" font-size="11" fill="#0f172a">user_id [FK]</text>
    <text x="652" y="383" font-size="11" fill="#0f172a">plan_id [FK]</text>
    <text x="652" y="402" font-size="11" fill="#0f172a">approved_at</text>
    <text x="652" y="421" font-size="11" fill="#0f172a">rejection_reason</text>
    <text x="652" y="440" font-size="11" fill="#0f172a">created_at</text>
  </g>

  <!-- ================================================================= -->
  <!-- 6. USERS (BOTTOM CENTER)                                          -->
  <!-- ================================================================= -->
  <g id="tbl-users">
    <rect x="630" y="660" width="240" height="175" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="750" y="684" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">users</text>
    <line x1="630" y1="694" x2="870" y2="694" stroke="#334155" stroke-width="1.2"/>

    <text x="642" y="715" font-size="11" font-weight="700" fill="#0f172a">user_id [PK]</text>
    <text x="642" y="734" font-size="11" fill="#0f172a">name</text>
    <text x="642" y="753" font-size="11" fill="#0f172a">email</text>
    <text x="642" y="772" font-size="11" fill="#0f172a">password</text>
    <text x="642" y="791" font-size="11" fill="#0f172a">role</text>
    <text x="642" y="810" font-size="11" fill="#0f172a">created_at</text>
  </g>

  <!-- ================================================================= -->
  <!-- 7. PAYMENTS (TOP RIGHT)                                           -->
  <!-- ================================================================= -->
  <g id="tbl-payments">
    <rect x="990" y="100" width="200" height="265" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="1090" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">payments</text>
    <line x1="990" y1="134" x2="1190" y2="134" stroke="#334155" stroke-width="1.2"/>

    <text x="1002" y="155" font-size="11" font-weight="700" fill="#0f172a">payment_id [PK]</text>
    <text x="1002" y="174" font-size="11" fill="#0f172a">member_id [FK]</text>
    <text x="1002" y="193" font-size="11" fill="#0f172a">subscription_id [FK]</text>
    <text x="1002" y="212" font-size="11" fill="#0f172a">amount</text>
    <text x="1002" y="231" font-size="11" fill="#0f172a">payment_method</text>
    <text x="1002" y="250" font-size="11" fill="#0f172a">reference_number</text>
    <text x="1002" y="269" font-size="11" fill="#0f172a">payment_date</text>
    <text x="1002" y="288" font-size="11" fill="#0f172a">user_id [FK]</text>
    <text x="1002" y="307" font-size="11" fill="#0f172a">notes</text>
    <text x="1002" y="326" font-size="11" fill="#0f172a">created_at</text>
  </g>

  <!-- ================================================================= -->
  <!-- 8. SUBSCRIPTIONS (MIDDLE RIGHT)                                   -->
  <!-- ================================================================= -->
  <g id="tbl-subscriptions">
    <rect x="1270" y="360" width="200" height="200" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="1370" y="384" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">subscriptions</text>
    <line x1="1270" y1="394" x2="1470" y2="394" stroke="#334155" stroke-width="1.2"/>

    <text x="1282" y="415" font-size="11" font-weight="700" fill="#0f172a">subscription_id [PK]</text>
    <text x="1282" y="434" font-size="11" fill="#0f172a">member_id [FK]</text>
    <text x="1282" y="453" font-size="11" fill="#0f172a">plan_id [FK]</text>
    <text x="1282" y="472" font-size="11" fill="#0f172a">start_date</text>
    <text x="1282" y="491" font-size="11" fill="#0f172a">expiry_date</text>
    <text x="1282" y="510" font-size="11" fill="#0f172a">user_id [FK]</text>
    <text x="1282" y="529" font-size="11" fill="#0f172a">created_at</text>
  </g>

  <!-- ================================================================= -->
  <!-- 9. PAYMENT_TRANSACTIONS (FAR RIGHT TOP)                           -->
  <!-- ================================================================= -->
  <g id="tbl-payment_transactions">
    <rect x="1540" y="100" width="245" height="255" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="1662" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">payment_transactions</text>
    <line x1="1540" y1="134" x2="1785" y2="134" stroke="#334155" stroke-width="1.2"/>

    <text x="1552" y="155" font-size="11" font-weight="700" fill="#0f172a">transaction_id [PK]</text>
    <text x="1552" y="174" font-size="11" fill="#0f172a">member_id [FK]</text>
    <text x="1552" y="193" font-size="11" fill="#0f172a">plan_id [FK]</text>
    <text x="1552" y="212" font-size="11" fill="#0f172a">reference_code</text>
    <text x="1552" y="231" font-size="11" fill="#0f172a">checkout_url</text>
    <text x="1552" y="250" font-size="11" fill="#0f172a">payment_method</text>
    <text x="1552" y="269" font-size="11" fill="#0f172a">amount</text>
    <text x="1552" y="288" font-size="11" fill="#0f172a">status</text>
    <text x="1552" y="307" font-size="11" fill="#0f172a">created_at</text>
    <text x="1552" y="326" font-size="11" fill="#0f172a">updated_at</text>
  </g>

  <!-- ================================================================= -->
  <!-- 10. ACTIVITY_LOGS (BOTTOM RIGHT - CENTER)                         -->
  <!-- ================================================================= -->
  <g id="tbl-activity_logs">
    <rect x="980" y="680" width="210" height="230" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="1085" y="704" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">activity_logs</text>
    <line x1="980" y1="714" x2="1190" y2="714" stroke="#334155" stroke-width="1.2"/>

    <text x="992" y="735" font-size="11" font-weight="700" fill="#0f172a">log_id [PK]</text>
    <text x="992" y="754" font-size="11" fill="#0f172a">user_id [FK]</text>
    <text x="992" y="773" font-size="11" fill="#0f172a">user_name</text>
    <text x="992" y="792" font-size="11" fill="#0f172a">action</text>
    <text x="992" y="811" font-size="11" fill="#0f172a">description</text>
    <text x="992" y="830" font-size="11" fill="#0f172a">module</text>
    <text x="992" y="849" font-size="11" fill="#0f172a">ip_address</text>
    <text x="992" y="868" font-size="11" fill="#0f172a">created_at</text>
  </g>

  <!-- ================================================================= -->
