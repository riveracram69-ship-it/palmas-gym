    <text x="170" y="384" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">renewal_requests</text>
    <line x1="60" y1="394" x2="280" y2="394" stroke="#334155" stroke-width="1.2"/>

    <text x="72" y="415" font-size="11" font-weight="700" fill="#0f172a">renewal_request_id [PK]</text>
    <text x="72" y="434" font-size="11" fill="#0f172a">member_id [FK]</text>
    <text x="72" y="453" font-size="11" fill="#0f172a">plan_id [FK]</text>
    <text x="72" y="472" font-size="11" fill="#0f172a">payment_method</text>
    <text x="72" y="491" font-size="11" fill="#0f172a">reference_no</text>
    <text x="72" y="510" font-size="11" fill="#0f172a">status</text>
    <text x="72" y="529" font-size="11" fill="#0f172a">notes</text>
    <text x="72" y="548" font-size="11" fill="#0f172a">user_id [FK]</text>
    <text x="72" y="567" font-size="11" fill="#0f172a">created_at</text>
    <text x="72" y="586" font-size="11" fill="#0f172a">updated_at</text>
  </g>

  <!-- ================================================================= -->
  <!-- 4. NOTIFICATIONS (BOTTOM LEFT)                                    -->
  <!-- ================================================================= -->
  <g id="tbl-notifications">
    <rect x="120" y="730" width="190" height="225" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <text x="215" y="754" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">notifications</text>
    <line x1="120" y1="764" x2="310" y2="764" stroke="#334155" stroke-width="1.2"/>

    <text x="132" y="785" font-size="11" font-weight="700" fill="#0f172a">notification_id [PK]</text>
    <text x="132" y="804" font-size="11" fill="#0f172a">member_id [FK]</text>
    <text x="132" y="823" font-size="11" fill="#0f172a">type</text>
    <text x="132" y="842" font-size="11" fill="#0f172a">title</text>
    <text x="132" y="861" font-size="11" fill="#0f172a">message</text>
    <text x="132" y="880" font-size="11" fill="#0f172a">delivery_status</text>
    <text x="132" y="899" font-size="11" fill="#0f172a">read_status</text>
