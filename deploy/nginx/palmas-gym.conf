# ==============================================================================
# NGINX PRODUCTION SERVER CONFIGURATION - PALMA'S ELITE GYM MANAGEMENT SYSTEM
# ==============================================================================
# Place in /etc/nginx/sites-available/palmas-gym.conf and symlink to sites-enabled
# Replace YOUR-DOMAIN.example with your actual domain and update paths accordingly.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN.example www.YOUR-DOMAIN.example;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR-DOMAIN.example www.YOUR-DOMAIN.example;

    # Document Root (points to the public web application root)
    root /var/www/palmas-gym/gym;
    index index.php index.html;

    # TLS / SSL Certificates (configure via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/YOUR-DOMAIN.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Max Upload Size (for member photo uploads)
    client_max_body_size 10M;

    # Disable direct access to sensitive directories
    location ~ ^/(config|backups|scratch|libs|\.git) {
        deny all;
        return 404;
    }

    # Disable direct access to sensitive file extensions
    location ~* \.(env|sql|log|ini|json|lock|sh|bat|md)$ {
        deny all;
        return 404;
    }

    # Disable direct access to standalone migration and seeder scripts
    location ~* ^/(migrate_|seed_|refactor_|create_|describe_|inspect_|show_|set_test_).*\.php$ {
        deny all;
        return 404;
    }

    # Protect Uploads Directory from Executing PHP scripts
    location ^~ /uploads/ {
        location ~ \.php$ {
            deny all;
            return 403;
        }
        try_files $uri =404;
    }

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Adjust PHP version as required
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization; # Critical for API Bearer tokens
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    # Static Asset Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
