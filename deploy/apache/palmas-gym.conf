# ==============================================================================
# APACHE VIRTUALHOST PRODUCTION CONFIGURATION - PALMA'S ELITE GYM SYSTEM
# ==============================================================================
# Place in /etc/apache2/sites-available/palmas-gym.conf and enable via a2ensite
# ==============================================================================

<VirtualHost *:80>
    ServerName YOUR-DOMAIN.example
    ServerAlias www.YOUR-DOMAIN.example

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName YOUR-DOMAIN.example
    ServerAlias www.YOUR-DOMAIN.example

    DocumentRoot /var/www/palmas-gym/gym

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/YOUR-DOMAIN.example/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/YOUR-DOMAIN.example/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    <Directory /var/www/palmas-gym/gym>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Disable PHP script execution inside uploads directory
    <Directory /var/www/palmas-gym/gym/uploads>
        <FilesMatch "\.ph(p[2-7]?|t|tml|ar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Protect internal configuration and backups
    <DirectoryMatch "^/var/www/palmas-gym/gym/(config|backups|scratch|libs)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/palmas_gym_error.log
    CustomLog ${APACHE_LOG_DIR}/palmas_gym_access.log combined
</VirtualHost>
