; ==============================================================================
; PHP PRODUCTION RUNTIME HARDENING - PALMA'S ELITE GYM MANAGEMENT SYSTEM
; ==============================================================================
; Recommended production settings to append to php.ini or /etc/php/8.2/fpm/conf.d/99-palmas-gym.ini
; ==============================================================================

; Error Handling (Prevent Information Disclosure & Path Leaks)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
track_errors = Off
html_errors = Off

; Resource Limits
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000
post_max_size = 10M
upload_max_filesize = 10M

; Session Security
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 86400

; Opcode Caching (Performance)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.revalidate_freq = 0

; Information Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
