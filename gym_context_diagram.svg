  <!-- RIGHT ENTITY: ADMIN                        -->
  <!-- ========================================== -->
  <g id="entity-admin">
    <rect x="1240" y="350" width="200" height="180" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="1240" y="350" width="200" height="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <text x="1340" y="440" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="1">ADMIN</text>
    <text x="1340" y="465" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">External Entity</text>
  </g>

