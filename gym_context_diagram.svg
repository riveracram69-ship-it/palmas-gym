  <!-- ========================================== -->
  <!-- FOOTER LEGEND AND CONVENTIONS NOTE         -->
  <!-- ========================================== -->
  <rect x="40" y="790" width="1400" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="816" font-size="12" font-weight="800" fill="#0f172a">DFD Level 0 (Context Diagram) Validation Legend:</text>
  <text x="60" y="835" font-size="11" font-weight="600" fill="#475569">External Entities: MEMBER, ADMIN | Pure Noun-Phrase Data Flows | Standard Gane &amp; Sarson Notation</text>
