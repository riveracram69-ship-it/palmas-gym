    <text x="1040" y="289" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Member Account &amp; Approval Data</text>
    <text x="1035" y="319" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Membership Plan &amp; Pricing Data</text>
    <text x="1025" y="349" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Payment &amp; Renewal Verification Data</text>
    <text x="1015" y="379" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Report Criteria &amp; Filter Parameters</text>
  </g>

  <!-- ========================================== -->
  <!-- 4. SYSTEM -> ADMIN (6 Flows)               -->
  <!-- ========================================== -->
  <g stroke="#0f172a" stroke-width="1.4" fill="none">
    <path d="M 960 480 L 1040 480 L 1040 475 L 1238 475" marker-end="url(#arrow)"/>
    <path d="M 960 510 L 1060 510 L 1060 495 L 1238 495" marker-end="url(#arrow)"/>
    <path d="M 960 540 L 1080 540 L 1080 515 L 1238 515" marker-end="url(#arrow)"/>
    <path d="M 960 570 L 1100 570 L 1100 535 L 1238 535" marker-end="url(#arrow)"/>
    <path d="M 960 600 L 1120 600 L 1120 555 L 1238 555" marker-end="url(#arrow)"/>
    <path d="M 960 630 L 1140 630 L 1140 575 L 1238 575" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="1010" y="474" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Authentication Result</text>
    <text x="1020" y="504" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Dashboard Information</text>
    <text x="1030" y="534" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Financial Reports</text>
    <text x="1040" y="564" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Attendance Analytics</text>
    <text x="1050" y="594" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Member Information</text>
    <text x="1060" y="624" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">System Activity Logs</text>
