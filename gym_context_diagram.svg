  <!-- BOTTOM ENTITY 1: SMTP / EMAIL SERVICE      -->
  <!-- ========================================== -->
  <g id="entity-smtp">
    <rect x="420" y="825" width="240" height="100" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
