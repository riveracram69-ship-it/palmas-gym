<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1600" height="70" fill="#0f172a"/>
  <text x="800" y="32" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="1.5">DATA FLOW DIAGRAM (DFD) LEVEL 0 — CONTEXT DIAGRAM</text>
  <text x="800" y="54" text-anchor="middle" font-size="12" font-weight="600" fill="#94a3b8">Palma's Elite Gym Management, Expense Ledger &amp; Mobile Attendance System | Gane &amp; Sarson Notation</text>

  <!-- ========================================== -->
  <!-- CENTRAL PROCESS: 0.0                       -->
  <!-- ========================================== -->
  <g id="center-system">
    <rect x="560" y="270" width="480" height="480" rx="28" fill="#ffffff" stroke="#0f172a" stroke-width="3" filter="url(#card-shadow)"/>
    <rect x="560" y="270" width="480" height="60" rx="28" fill="#f1f5f9"/>
    <rect x="560" y="300" width="480" height="30" fill="#f1f5f9"/>
    <line x1="560" y1="330" x2="1040" y2="330" stroke="#0f172a" stroke-width="2"/>
    <text x="800" y="308" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">0.0</text>
    <text text-anchor="middle" fill="#0f172a">
      <tspan x="800" y="425" font-size="22" font-weight="800" letter-spacing="-0.3">Palma's Elite Gym</tspan>
      <tspan x="800" y="460" font-size="17" font-weight="700" fill="#2563eb">Membership, Expenses, Attendance</tspan>
      <tspan x="800" y="490" font-size="17" font-weight="700" fill="#2563eb">&amp; Financial Management System</tspan>
      <tspan x="800" y="545" font-size="12.5" font-weight="700" fill="#64748b">[ Complete System Boundary ]</tspan>
      <tspan x="800" y="575" font-size="11.5" font-weight="600" fill="#475569">Web Admin • Expense Tracker • Member Portal • Mobile App • REST API</tspan>
    </text>
  </g>

  <!-- ========================================== -->
  <!-- LEFT ENTITY: MEMBER (Web & Mobile App)     -->
  <!-- ========================================== -->
  <g id="entity-member">
    <rect x="40" y="370" width="220" height="280" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="40" y="370" width="220" height="18" fill="#dbeafe" stroke="#0f172a" stroke-width="2.5"/>
    <text x="150" y="440" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="1">MEMBER</text>
    <text x="150" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">(Gym Client)</text>
    <text x="150" y="500" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Mobile App (Android)</text>
    <text x="150" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Member Web Portal</text>
    <text x="150" y="550" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Digital ID &amp; Dynamic QR</text>
    <text x="150" y="575" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Online Payment (PayMongo)</text>
    <text x="150" y="600" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Self-Service Renewals</text>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT ENTITY: ADMIN / STAFF                -->
  <!-- ========================================== -->
  <g id="entity-admin">
    <rect x="1340" y="370" width="220" height="280" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="1340" y="370" width="220" height="18" fill="#fee2e2" stroke="#0f172a" stroke-width="2.5"/>
    <text x="1450" y="440" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="1">ADMIN / STAFF</text>
    <text x="1450" y="465" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">(Gym Management)</text>
    <text x="1450" y="495" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Admin Web Dashboard</text>
    <text x="1450" y="520" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Operating Expense Ledger</text>
    <text x="1450" y="545" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Member Approvals &amp; POS</text>
    <text x="1450" y="570" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• QR Attendance Scanner</text>
    <text x="1450" y="595" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Net Profit &amp; Audit Reports</text>
  </g>

  <!-- ========================================== -->
  <!-- TOP ENTITY 1: GOOGLE OAUTH 2.0 PROVIDER    -->
  <!-- ========================================== -->
  <g id="entity-google">
    <rect x="420" y="95" width="240" height="100" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <rect x="420" y="95" width="240" height="12" fill="#fef3c7" stroke="#0f172a" stroke-width="2.2"/>
    <text x="540" y="145" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">GOOGLE OAUTH 2.0</text>
    <text x="540" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">Identity &amp; Single Sign-On Provider</text>
  </g>

