<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 880" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1480" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="740" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="1">DATA FLOW DIAGRAM (DFD) LEVEL 0 — CONTEXT DIAGRAM</text>
  <text x="740" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Complete System Boundaries | Pure Noun-Phrase Data Flows | Gane &amp; Sarson Notation</text>

  <!-- ========================================== -->
  <!-- LEFT ENTITY: MEMBER                        -->
  <!-- ========================================== -->
  <g id="entity-member">
    <rect x="40" y="350" width="200" height="180" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="40" y="350" width="200" height="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <text x="140" y="440" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="1">MEMBER</text>
    <text x="140" y="465" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">External Entity</text>
  </g>

  <!-- ========================================== -->
  <!-- CENTRAL PROCESS: 0.0                       -->
  <!-- ========================================== -->
  <g id="center-system">
    <rect x="520" y="210" width="440" height="460" rx="24" fill="#ffffff" stroke="#0f172a" stroke-width="2.8" filter="url(#card-shadow)"/>
    <line x1="520" y1="260" x2="960" y2="260" stroke="#0f172a" stroke-width="1.8"/>
    <text x="740" y="246" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">0.0</text>
    <text text-anchor="middle" fill="#0f172a">
      <tspan x="740" y="390" font-size="20" font-weight="800" letter-spacing="-0.2">Palma's Elite Gym</tspan>
      <tspan x="740" y="425" font-size="16" font-weight="700">Membership and Attendance</tspan>
      <tspan x="740" y="455" font-size="16" font-weight="700">Management System</tspan>
      <tspan x="740" y="520" font-size="12" font-weight="700" fill="#64748b">[ Context Diagram — DFD Level 0 ]</tspan>
    </text>
  </g>

