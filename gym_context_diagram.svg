    <path d="M 520 480 L 450 480 L 450 485 L 242 485" marker-end="url(#arrow)"/>
    <path d="M 520 510 L 430 510 L 430 505 L 242 505" marker-end="url(#arrow)"/>
    <path d="M 520 540 L 410 540 L 410 525 L 242 525" marker-end="url(#arrow)"/>
    <path d="M 520 570 L 390 570 L 390 545 L 242 545" marker-end="url(#arrow)"/>
    <path d="M 520 600 L 370 600 L 370 565 L 242 565" marker-end="url(#arrow)"/>
    <path d="M 520 630 L 350 630 L 350 585 L 242 585" marker-end="url(#arrow)"/>
