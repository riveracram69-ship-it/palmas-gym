  <!-- TOP ENTITY 2: PAYMONGO PAYMENT GATEWAY     -->
  <!-- ========================================== -->
  <g id="entity-paymongo">
    <rect x="940" y="95" width="240" height="100" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <rect x="940" y="95" width="240" height="12" fill="#d1fae5" stroke="#0f172a" stroke-width="2.2"/>
    <text x="1060" y="145" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">PAYMONGO GATEWAY</text>
    <text x="1060" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">E-Wallets (GCash/Maya) &amp; Cards</text>
  </g>

