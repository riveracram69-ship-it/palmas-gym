    <path d="M 1240 375 L 1130 375 L 1130 265 L 962 265" marker-end="url(#arrow)"/>
    <path d="M 1240 395 L 1110 395 L 1110 295 L 962 295" marker-end="url(#arrow)"/>
    <path d="M 1240 415 L 1090 415 L 1090 325 L 962 325" marker-end="url(#arrow)"/>
    <path d="M 1240 435 L 1070 435 L 1070 355 L 962 355" marker-end="url(#arrow)"/>
