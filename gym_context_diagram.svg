    <text x="1085" y="569" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Live Dashboard Metrics &amp; Monthly Net Income</text>
    <text x="1095" y="594" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Revenue, Expense Ledgers &amp; Net Profit Breakdown</text>
    <text x="1105" y="619" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Attendance Traffic &amp; Peak Hour Heatmaps</text>
    <text x="1115" y="644" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Member Records &amp; Pending Approvals</text>
    <text x="1125" y="669" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Audit Logs &amp; Database Backup Archives</text>
  </g>

  <!-- ========================================== -->
  <!-- 5. TOP FLOWS: GOOGLE OAUTH & PAYMONGO      -->
  <!-- ========================================== -->
  <g stroke="#0f172a" stroke-width="1.5" fill="none">
    <!-- Google OAuth -->
    <path d="M 600 270 L 600 198" marker-end="url(#arrow)"/>
    <path d="M 520 195 L 520 270" marker-end="url(#arrow)"/>
    <!-- PayMongo -->
    <path d="M 1000 270 L 1000 198" marker-end="url(#arrow-green)"/>
    <path d="M 1080 195 L 1080 270" marker-end="url(#arrow-green)"/>
  </g>
  <g font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="660" y="235" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">OAuth ID Token Verification</text>
    <text x="460" y="235" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Verified Profile &amp; Google ID</text>
    <text x="940" y="235" fill="#059669" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Create Checkout Intent</text>
    <text x="1150" y="235" fill="#059669" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Webhook Payment Success</text>
  </g>

  <!-- ========================================== -->
  <!-- 6. BOTTOM FLOWS: SMTP & FCM PUSH           -->
  <!-- ========================================== -->
  <g stroke="#0f172a" stroke-width="1.5" fill="none">
    <!-- SMTP -->
    <path d="M 600 750 L 600 822" marker-end="url(#arrow-purple)"/>
    <!-- FCM -->
    <path d="M 1000 750 L 1000 822" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="600" y="788" fill="#7c3aed" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Transactional Emails (OTP / Receipts / Expiry)</text>
    <text x="1000" y="788" fill="#ea580c" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">FCM Push Payload (Reminders / Check-in Alerts)</text>
  </g>

  <!-- ========================================== -->
  <!-- FOOTER LEGEND AND CONVENTIONS NOTE         -->
  <!-- ========================================== -->
  <rect x="40" y="950" width="1520" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="980" font-size="12" font-weight="800" fill="#0f172a">DFD Level 0 Context Model Architecture:</text>
  <text x="350" y="980" font-size="11.5" font-weight="600" fill="#475569">Entities: Member (Web/Mobile), Admin/Staff, PayMongo, Google OAuth, SMTP, FCM | Comprehensive Expense &amp; Revenue Accounting</text>
</svg>
