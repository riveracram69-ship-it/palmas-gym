  <!-- ========================================== -->
  <g stroke="#2563eb" stroke-width="1.5" fill="none">
    <path d="M 560 550 L 470 550 L 470 540 L 262 540" marker-end="url(#arrow-blue)"/>
    <path d="M 560 580 L 450 580 L 450 570 L 262 570" marker-end="url(#arrow-blue)"/>
    <path d="M 560 610 L 430 610 L 430 600 L 262 600" marker-end="url(#arrow-blue)"/>
    <path d="M 560 640 L 410 640 L 410 630 L 262 630" marker-end="url(#arrow-blue)"/>
    <path d="M 560 670 L 390 670 L 390 660 L 262 660" marker-end="url(#arrow-blue)"/>
  </g>
  <g font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">
    <text x="515" y="544" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Auth Token &amp; Member Profile</text>
    <text x="505" y="574" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Active Subscription &amp; Expiry Info</text>
    <text x="495" y="604" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Dynamic Rotating QR Pass</text>
    <text x="485" y="634" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Payment Receipt &amp; Status</text>
    <text x="475" y="664" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Attendance &amp; Expiry Alerts</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. ADMIN -> SYSTEM FLOWS (Including Expenses) -->
  <!-- ========================================== -->
  <g stroke="#0f172a" stroke-width="1.5" fill="none">
    <path d="M 1340 380 L 1210 380 L 1210 340 L 1042 340" marker-end="url(#arrow)"/>
    <path d="M 1340 405 L 1190 405 L 1190 365 L 1042 365" marker-end="url(#arrow)"/>
    <path d="M 1340 430 L 1170 430 L 1170 390 L 1042 390" marker-end="url(#arrow)"/>
    <path d="M 1340 455 L 1150 455 L 1150 415 L 1042 415" marker-end="url(#arrow)"/>
    <path d="M 1340 480 L 1130 480 L 1130 440 L 1042 440" marker-end="url(#arrow)"/>
    <path d="M 1340 505 L 1110 505 L 1110 465 L 1042 465" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="1125" y="334" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Admin Credentials &amp; 2FA</text>
    <text x="1115" y="359" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Member Account Approvals &amp; Edits</text>
    <text x="1105" y="384" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Plan Config &amp; Pricing Management</text>
    <text x="1095" y="409" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Manual Cash Payment / Renewal Entry</text>
    <text x="1085" y="434" fill="#b91c1c" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Operating Expense &amp; Receipt Voucher Data</text>
    <text x="1075" y="459" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Report Filters &amp; Backup Triggers</text>
  </g>

  <!-- ========================================== -->
  <!-- 4. SYSTEM -> ADMIN FLOWS (Including Net Income) -->
  <!-- ========================================== -->
  <g stroke="#dc2626" stroke-width="1.5" fill="none">
    <path d="M 1040 550 L 1110 550 L 1110 540 L 1338 540" marker-end="url(#arrow-red)"/>
    <path d="M 1040 575 L 1130 575 L 1130 565 L 1338 565" marker-end="url(#arrow-red)"/>
    <path d="M 1040 600 L 1150 600 L 1150 590 L 1338 590" marker-end="url(#arrow-red)"/>
    <path d="M 1040 625 L 1170 625 L 1170 615 L 1338 615" marker-end="url(#arrow-red)"/>
    <path d="M 1040 650 L 1190 650 L 1190 640 L 1338 640" marker-end="url(#arrow-red)"/>
    <path d="M 1040 675 L 1210 675 L 1210 665 L 1338 665" marker-end="url(#arrow-red)"/>
  </g>
  <g font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">
