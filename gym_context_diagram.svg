    <text x="540" y="898" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">PHPMailer / Transactional Delivery</text>
  </g>

  <!-- ========================================== -->
  <!-- BOTTOM ENTITY 2: FCM PUSH NOTIFICATIONS    -->
  <!-- ========================================== -->
  <g id="entity-fcm">
    <rect x="940" y="825" width="240" height="100" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <rect x="940" y="825" width="240" height="12" fill="#ffedd5" stroke="#0f172a" stroke-width="2.2"/>
    <text x="1060" y="875" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">FCM PUSH NOTIFICATIONS</text>
    <text x="1060" y="898" text-anchor="middle" font-size="11" font-weight="600" fill="#ea580c">Firebase Mobile Device Alerts</text>
  </g>

  <!-- ========================================== -->
  <!-- 1. MEMBER -> SYSTEM FLOWS                  -->
  <!-- ========================================== -->
  <g stroke="#0f172a" stroke-width="1.5" fill="none">
    <path d="M 260 380 L 390 380 L 390 340 L 558 340" marker-end="url(#arrow)"/>
    <path d="M 260 410 L 410 410 L 410 370 L 558 370" marker-end="url(#arrow)"/>
    <path d="M 260 440 L 430 440 L 430 400 L 558 400" marker-end="url(#arrow)"/>
    <path d="M 260 470 L 450 470 L 450 430 L 558 430" marker-end="url(#arrow)"/>
    <path d="M 260 500 L 470 500 L 470 460 L 558 460" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="475" y="334" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Registration &amp; Profile Data</text>
    <text x="485" y="364" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Login Credentials / Token</text>
    <text x="495" y="394" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Plan Selection &amp; Renewal Request</text>
    <text x="505" y="424" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">PayMongo Payment Checkout Request</text>
    <text x="515" y="454" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px;">Dynamic QR Scan Data</text>
  </g>

  <!-- ========================================== -->
