<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 920" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1350" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="675" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="1">DFD LEVEL 2 — PROCESS 3.0: MANAGE SUBSCRIPTIONS &amp; PLANS</text>
  <text x="675" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Sub-process Decomposition | Standard Gane &amp; Sarson Notation | Pure Noun-Phrase Data Flows</text>

  <!-- ================================================================= -->
  <!-- EXTERNAL ENTITIES (LEFT COLUMN: x=60 to x=240, width=180)         -->
  <!-- ================================================================= -->

  <!-- MEMBER ENTITY (Top-Left: y=90 to y=170) -->
  <g id="entity-member">
    <rect x="60" y="90" width="180" height="80" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="60" y="90" width="180" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <text x="150" y="138" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">MEMBER</text>
    <text x="150" y="156" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">External Entity</text>
  </g>

  <!-- ADMIN ENTITY (Bottom-Left: y=700 to y=780) -->
  <g id="entity-admin">
    <rect x="60" y="700" width="180" height="80" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="60" y="700" width="180" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <text x="150" y="748" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">ADMIN</text>
    <text x="150" y="766" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">External Entity</text>
  </g>

  <!-- ================================================================= -->
  <!-- SUB-PROCESSES (CENTER COLUMN: x=480 to x=740, Width=260)         -->
  <!-- ================================================================= -->

  <!-- 3.1 Display Available Plans -->
  <g id="subproc-3-1">
    <rect x="480" y="90" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="120" x2="740" y2="120" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">3.1</text>
    <text x="610" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Display Available Plans</text>
  </g>

  <!-- 3.2 Process Plan Selection -->
  <g id="subproc-3-2">
    <rect x="480" y="280" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="310" x2="740" y2="310" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="302" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">3.2</text>
    <text x="610" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Process Plan Selection</text>
  </g>

  <!-- 3.3 Assign Member Subscription -->
  <g id="subproc-3-3">
    <rect x="480" y="470" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="500" x2="740" y2="500" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="492" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">3.3</text>
    <text x="610" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Assign Member Subscription</text>
  </g>

  <!-- 3.4 Configure Membership Plan -->
  <g id="subproc-3-4">
    <rect x="480" y="700" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="730" x2="740" y2="730" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="722" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">3.4</text>
    <text x="610" y="758" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Configure Membership Plan</text>
  </g>

  <!-- ================================================================= -->
  <!-- DATA STORES (RIGHT COLUMN: D1, D3, D4)                            -->
  <!-- ================================================================= -->

  <!-- D3 Membership_Plans (Read by 3.1) -->
  <g id="ds-d3-top">
    <line x1="980" y1="105" x2="980" y2="150" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="105" x2="1260" y2="105" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="150" x2="1260" y2="150" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="105" x2="1025" y2="150" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="133" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D3</text>
    <text x="1142" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Membership_Plans</text>
  </g>

  <!-- D1 Members (Read by 3.3) -->
  <g id="ds-d1">
    <line x1="980" y1="455" x2="980" y2="500" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="455" x2="1260" y2="455" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="500" x2="1260" y2="500" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="455" x2="1025" y2="500" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="483" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D1</text>
    <text x="1142" y="483" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Members</text>
  </g>

  <!-- D4 Subscriptions (Written by 3.3) -->
  <g id="ds-d4">
    <line x1="980" y1="525" x2="980" y2="570" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="525" x2="1260" y2="525" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="570" x2="1260" y2="570" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="525" x2="1025" y2="570" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="553" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D4</text>
    <text x="1142" y="553" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Subscriptions</text>
  </g>

  <!-- D3 Membership_Plans (Written by 3.4) -->
  <g id="ds-d3-bottom">
    <line x1="980" y1="715" x2="980" y2="760" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="715" x2="1260" y2="715" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="760" x2="1260" y2="760" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="715" x2="1025" y2="760" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="743" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D3</text>
    <text x="1142" y="743" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Membership_Plans</text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT-SIDE DATA FLOWS (MEMBER & ADMIN INTERACTIONS)                -->
  <!-- ================================================================= -->

  <!-- 1. MEMBER -> 3.1 (Plan Catalog Request) -->
  <line x1="240" y1="110" x2="478" y2="110" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="103" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Plan Catalog Request</text>

  <!-- 2. 3.1 -> MEMBER (Available Membership Plans) -->
  <path d="M 480 145 L 242 145" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="139" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Available Membership Plans</text>

  <!-- 3. MEMBER -> 3.2 (Plan Selection Request) -->
  <path d="M 240 160 L 320 160 L 320 315 L 478 315" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="380" y="308" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Plan Selection Request</text>

  <!-- 4. 3.3 -> MEMBER (Subscription Confirmation) -->
  <path d="M 480 490 L 275 490 L 275 165 L 242 165" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="483" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Subscription Confirmation</text>

  <!-- 5. ADMIN -> 3.4 (Plan Configuration Data) -->
  <line x1="240" y1="745" x2="478" y2="745" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="738" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Plan Configuration Data</text>

  <!-- 6. 3.4 -> ADMIN (Plan Configuration Confirmation) -->
  <path d="M 480 765 L 242 765" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="779" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Plan Configuration Confirmation</text>

  <!-- ================================================================= -->
  <!-- CENTER SUB-PROCESS FLOWS                                          -->
  <!-- ================================================================= -->

  <!-- 3.2 -> 3.3 (Selected Plan Payload) -->
  <line x1="610" y1="355" x2="610" y2="468" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="415" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Selected Plan Payload</text>

  <!-- ================================================================= -->
  <!-- RIGHT-SIDE DATA STORE FLOWS                                       -->
  <!-- ================================================================= -->

  <!-- D3 -> 3.1 (Plan Specification Data) -->
  <line x1="978" y1="128" x2="742" y2="128" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="121" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Plan Specification Data</text>

  <!-- D1 -> 3.3 (Member Account Record) -->
  <line x1="978" y1="478" x2="742" y2="478" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="471" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Member Account Record</text>

  <!-- 3.3 -> D4 (New Subscription Record (Pending Payment)) -->
  <line x1="740" y1="548" x2="978" y2="548" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="541" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">New Subscription Record (Pending Payment)</text>

  <!-- 3.4 -> D3 (Membership Plan Record) -->
  <line x1="740" y1="738" x2="978" y2="738" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="731" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Membership Plan Record</text>

  <!-- ================================================================= -->
  <!-- FOOTER LEGEND AND CONVENTIONS NOTE                                -->
  <!-- ================================================================= -->
  <rect x="40" y="830" width="1270" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="856" font-size="12" font-weight="800" fill="#0f172a">DFD Level 2 (Process 3.0) Validation Legend:</text>
  <text x="60" y="875" font-size="11" font-weight="600" fill="#475569">Sub-processes: 3.1 Display Available Plans | 3.2 Process Plan Selection | 3.3 Assign Member Subscription | 3.4 Configure Membership Plan | Pure Noun Phrases</text>
</svg>
