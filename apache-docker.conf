# ==============================================================================
# APACHE CONFIGURATION FOR DOCKER / RENDER - PALMA'S ELITE GYM MANAGEMENT SYSTEM
# ==============================================================================

<VirtualHost *:80>
    ServerAdmin admin@palmasgym.com
    DocumentRoot /var/www/html/gym
    Alias /gym /var/www/html/gym

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"

    <Directory /var/www/html/gym>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Pass HTTP Authorization header to PHP
        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    </Directory>

    # Block direct HTTP access to internal / sensitive directories
    <DirectoryMatch "^/var/www/html/gym/(config|backups|scratch|libs|tests|deploy|mobile-app)">
        Require all denied
    </DirectoryMatch>

    # Disable PHP script execution inside uploads directory
    <Directory /var/www/html/gym/uploads>
        <FilesMatch "\.ph(p[2-8]?|t|tml|ar|s)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # APK MIME Type & Direct Download Headers
    AddType application/vnd.android.package-archive .apk
    <Directory /var/www/html/gym/downloads>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        <FilesMatch "\.apk$">
            Header set Content-Disposition "attachment; filename=\"palmas-elite-gym.apk\""
            Header set Content-Type "application/vnd.android.package-archive"
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Access-Control-Allow-Origin "*"
        </FilesMatch>
    </Directory>

    # Block sensitive file extensions across the entire site (excluding .apk)
    <FilesMatch "^\.|\.(env|sql|log|ini|json|lock|git|sh|bat|md)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/palmas_gym_error.log
    CustomLog ${APACHE_LOG_DIR}/palmas_gym_access.log combined
</VirtualHost>
