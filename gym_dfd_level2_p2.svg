<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 920" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1350" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="675" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="1">DFD LEVEL 2 — PROCESS 2.0: REGISTER MEMBER</text>
  <text x="675" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Sub-process Decomposition | Profile Validation &amp; Approval Loop | Pure Noun-Phrase Data Flows</text>

  <!-- ================================================================= -->
  <!-- EXTERNAL ENTITIES (LEFT COLUMN: x=60 to x=240, width=180)         -->
  <!-- ================================================================= -->

  <!-- MEMBER ENTITY (Top-Left: y=90 to y=170) -->
  <g id="entity-member">
    <rect x="60" y="90" width="180" height="80" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="60" y="90" width="180" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <text x="150" y="138" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">MEMBER</text>
    <text x="150" y="156" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">External Entity</text>
  </g>

  <!-- ADMIN ENTITY (Bottom-Left: y=700 to y=780) -->
  <g id="entity-admin">
    <rect x="60" y="700" width="180" height="80" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="60" y="700" width="180" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <text x="150" y="748" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">ADMIN</text>
    <text x="150" y="766" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">External Entity</text>
  </g>

  <!-- ================================================================= -->
  <!-- SUB-PROCESSES (CENTER COLUMN: x=480 to x=740, Width=260)         -->
  <!-- ================================================================= -->

  <!-- 2.1 Receive Registration Details -->
  <g id="subproc-2-1">
    <rect x="480" y="90" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="120" x2="740" y2="120" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2.1</text>
    <text x="610" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Receive Registration Details</text>
  </g>

  <!-- 2.2 Validate Member Eligibility -->
  <g id="subproc-2-2">
    <rect x="480" y="280" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="310" x2="740" y2="310" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="302" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2.2</text>
    <text x="610" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Validate Member Eligibility</text>
  </g>

  <!-- 2.3 Process Account Approval -->
  <g id="subproc-2-3">
    <rect x="480" y="470" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="500" x2="740" y2="500" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="492" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2.3</text>
    <text x="610" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Process Account Approval</text>
  </g>

  <!-- 2.4 Issue Membership Credentials -->
  <g id="subproc-2-4">
    <rect x="480" y="700" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="730" x2="740" y2="730" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="722" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2.4</text>
    <text x="610" y="758" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Issue Membership Credentials</text>
  </g>

  <!-- ================================================================= -->
  <!-- DATA STORES (RIGHT COLUMN: D1, D3)                                -->
  <!-- ================================================================= -->

  <!-- D3 Membership_Plans (Read by 2.1) -->
  <g id="ds-d3">
    <line x1="980" y1="105" x2="980" y2="150" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="105" x2="1260" y2="105" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="150" x2="1260" y2="150" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="105" x2="1025" y2="150" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="133" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D3</text>
    <text x="1142" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Membership_Plans</text>
  </g>

  <!-- D1 Members (Read by 2.2) -->
  <g id="ds-d1-top">
    <line x1="980" y1="280" x2="980" y2="325" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="280" x2="1260" y2="280" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="325" x2="1260" y2="325" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="280" x2="1025" y2="325" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="308" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D1</text>
    <text x="1142" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Members</text>
  </g>

  <!-- D1 Members (Written by 2.2 & 2.3) -->
  <g id="ds-d1-bottom">
    <line x1="980" y1="480" x2="980" y2="525" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="480" x2="1260" y2="480" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="525" x2="1260" y2="525" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="480" x2="1025" y2="525" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="508" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D1</text>
    <text x="1142" y="508" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Members</text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT-SIDE DATA FLOWS (ZERO CROSSING DEDICATED LANES)              -->
  <!-- ================================================================= -->

  <!-- 1. MEMBER -> 2.1 (Registration Information) Direct Horizontal -->
  <line x1="240" y1="115" x2="478" y2="115" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="108" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Registration Information</text>

  <!-- 2. 2.2 -> MEMBER (Registration Validation Error) Lane at x=320 -->
  <path d="M 480 295 L 320 295 L 320 135 L 242 135" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="380" y="288" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Registration Validation Error</text>

  <!-- 3. 2.2 -> ADMIN (Pending Registration Alert) Lane at x=380 -->
  <path d="M 480 335 L 380 335 L 380 725 L 242 725" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="328" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Pending Registration Alert</text>  <!-- 4. ADMIN -> 2.3 (Member Approval Decision) Lane at x=190 -->
  <path d="M 190 700 L 190 525 L 478 525" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="519" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Member Approval Decision</text>

  <!-- 5. 2.3 -> MEMBER (Registration Rejection Notice) Lane at x=350 -->
  <path d="M 480 485 L 350 485 L 350 145 L 242 145" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="478" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Registration Rejection Notice</text>

  <!-- 6. 2.4 -> MEMBER (Membership ID & QR Pass) Dedicated Lane at x=280 entering MEMBER at y=155 -->
  <path d="M 480 735 L 280 735 L 280 155 L 242 155" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="162" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Membership ID &amp; QR Pass</text>

  <!-- ================================================================= -->
  <!-- CENTER SUB-PROCESS FLOWS                                          -->
  <!-- ================================================================= -->

  <!-- 2.1 -> 2.2 (Candidate Member Profile) -->
  <line x1="610" y1="165" x2="610" y2="278" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="225" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Candidate Member Profile</text>

  <!-- 2.2 -> 2.3 (Pending Registration Payload) -->
  <line x1="610" y1="355" x2="610" y2="468" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="415" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Pending Registration Payload</text>

  <!-- 2.3 -> 2.4 (Approved Member Data) -->
  <line x1="610" y1="545" x2="610" y2="698" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="625" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Approved Member Data</text>

  <!-- ================================================================= -->
  <!-- RIGHT-SIDE DATA STORE FLOWS                                       -->
  <!-- ================================================================= -->

  <!-- D3 -> 2.1 (Available Plan Details) -->
  <line x1="978" y1="128" x2="742" y2="128" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="121" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Available Plan Details</text>

  <!-- D1 -> 2.2 (Existing Member Account Record) -->
  <line x1="978" y1="302" x2="742" y2="302" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="295" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Existing Member Account Record</text>

  <!-- 2.2 -> D1 (Pending Member Registration Record) -->
  <path d="M 740 335 L 850 335 L 850 490 L 978 490" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="860" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Pending Member Registration Record</text>

  <!-- 2.3 -> D1 (Approved Member Status Record) -->
  <line x1="740" y1="512" x2="978" y2="512" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="505" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Approved Member Status Record</text>

  <!-- ================================================================= -->
  <!-- FOOTER LEGEND AND CONVENTIONS NOTE                                -->
  <!-- ================================================================= -->
  <rect x="40" y="830" width="1270" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="856" font-size="12" font-weight="800" fill="#0f172a">DFD Level 2 (Process 2.0) Validation Legend:</text>
  <text x="60" y="875" font-size="11" font-weight="600" fill="#475569">Sub-processes: 2.1 Receive Registration Details | 2.2 Validate Member Eligibility | 2.3 Process Account Approval | 2.4 Issue Membership Credentials | Data Stores: D1, D3 | Pure Noun Phrases</text>
</svg>
