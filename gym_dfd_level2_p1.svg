<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 920" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1350" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="675" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="1">DFD LEVEL 2 — PROCESS 1.0: VERIFY USER CREDENTIALS</text>
  <text x="675" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Sub-process Decomposition | Dedicated Entity Channels | Pure Noun-Phrase Data Flows</text>

  <!-- ================================================================= -->
  <!-- EXTERNAL ENTITIES (LEFT COLUMN: x=60 to x=240, width=180)         -->
  <!-- ================================================================= -->

  <!-- MEMBER ENTITY (Top-Left: y=90 to y=170) -->
  <g id="entity-member">
    <rect x="60" y="90" width="180" height="80" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="60" y="90" width="180" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <text x="150" y="138" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">MEMBER</text>
    <text x="150" y="156" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">External Entity</text>
  </g>

  <!-- ADMIN ENTITY (Bottom-Left: y=700 to y=780) -->
  <g id="entity-admin">
    <rect x="60" y="700" width="180" height="80" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="60" y="700" width="180" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <text x="150" y="748" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">ADMIN</text>
    <text x="150" y="766" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">External Entity</text>
  </g>

  <!-- ================================================================= -->
  <!-- SUB-PROCESSES (CENTER COLUMN: x=480 to x=740, Width=260)         -->
  <!-- ================================================================= -->

  <!-- 1.1 Receive Credentials -->
  <g id="subproc-1-1">
    <rect x="480" y="90" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="120" x2="740" y2="120" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1.1</text>
    <text x="610" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Receive Credentials</text>
  </g>

  <!-- 1.2 Validate Account Data -->
  <g id="subproc-1-2">
    <rect x="480" y="280" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="310" x2="740" y2="310" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="302" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1.2</text>
    <text x="610" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Validate Account Data</text>
  </g>

  <!-- 1.3 Create User Session -->
  <g id="subproc-1-3">
    <rect x="480" y="470" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="500" x2="740" y2="500" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="492" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1.3</text>
    <text x="610" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Create User Session</text>
  </g>

  <!-- 1.4 Record Login Log -->
  <g id="subproc-1-4">
    <rect x="480" y="700" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="730" x2="740" y2="730" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="722" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1.4</text>
    <text x="610" y="758" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Record Login Log</text>
  </g>

  <!-- ================================================================= -->
  <!-- DATA STORES (RIGHT COLUMN: D1, D2, D9)                            -->
  <!-- ================================================================= -->

  <!-- D1 Members -->
  <g id="ds-d1">
    <line x1="980" y1="265" x2="980" y2="310" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="265" x2="1260" y2="265" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="310" x2="1260" y2="310" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="265" x2="1025" y2="310" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="293" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D1</text>
    <text x="1142" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Members</text>
  </g>

  <!-- D2 Users -->
  <g id="ds-d2">
    <line x1="980" y1="335" x2="980" y2="380" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="335" x2="1260" y2="335" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="380" x2="1260" y2="380" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="335" x2="1025" y2="380" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="363" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D2</text>
    <text x="1142" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Users</text>
  </g>

  <!-- D9 Activity_Logs -->
  <g id="ds-d9">
    <line x1="980" y1="715" x2="980" y2="760" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="715" x2="1260" y2="715" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="760" x2="1260" y2="760" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="715" x2="1025" y2="760" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="743" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D9</text>
    <text x="1142" y="743" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Activity_Logs</text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT-SIDE DATA FLOWS (SEPARATED LANES & BRIDGES)                  -->
  <!-- ================================================================= -->

  <!-- 1. MEMBER -> 1.1 (Login Credentials) Direct Horizontal Line -->
  <line x1="240" y1="115" x2="478" y2="115" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="107" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Login Credentials</text>

  <!-- 2. ADMIN -> 1.1 (Staff Login Credentials) Dedicated Outer Left Lane (x=30) -->
  <path d="M 60 740 L 30 740 L 30 65 L 560 65 L 560 88" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="290" y="58" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Staff Login Credentials</text>

  <!-- 3. 1.2 -> MEMBER (Authentication Failure Message) Lane at x=320 -->
  <path d="M 480 295 L 320 295 L 320 140 L 242 140" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="380" y="288" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Authentication Failure Message</text>

  <!-- 4. 1.2 -> ADMIN (Authentication Failure Message) Lane at x=360 with Bridge Arc at y=485 -->
  <path d="M 480 335 L 360 335 L 360 477 A 8 8 0 0 0 360 493 L 360 725 L 242 725" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="395" y="328" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Authentication Failure Message</text>

  <!-- 5. 1.3 -> MEMBER (Login Status & Session Token) Lane at x=280 -->
  <path d="M 480 485 L 280 485 L 280 155 L 242 155" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="390" y="478" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Login Status &amp; Session Token</text>

  <!-- 6. 1.3 -> ADMIN (Admin Session & Access Rights) Lane at x=400 -->
  <path d="M 480 525 L 400 525 L 400 755 L 242 755" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="390" y="518" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Admin Session &amp; Access Rights</text>

  <!-- ================================================================= -->
  <!-- CENTER & RIGHT DATA FLOWS                                         -->
  <!-- ================================================================= -->

  <!-- 1.1 -> 1.2 (Authentication Payload) -->
  <line x1="610" y1="165" x2="610" y2="278" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="225" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Authentication Payload</text>

  <!-- D1 -> 1.2 (Member Account Record) -->
  <line x1="978" y1="290" x2="742" y2="290" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="283" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Member Account Record</text>

  <!-- D2 -> 1.2 (Staff Account Record) -->
  <line x1="978" y1="350" x2="742" y2="350" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="343" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Staff Account Record</text>

  <!-- 1.2 -> 1.3 (Validated User Profile) -->
  <line x1="610" y1="355" x2="610" y2="468" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="415" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Validated User Profile</text>

  <!-- 1.3 -> 1.4 (Active Session Data) -->
  <line x1="610" y1="545" x2="610" y2="698" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="625" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Active Session Data</text>

  <!-- 1.4 -> D9 (Login Audit Entry) -->
  <line x1="740" y1="740" x2="978" y2="740" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="733" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Login Audit Entry</text>

  <!-- ================================================================= -->
  <!-- FOOTER LEGEND AND CONVENTIONS NOTE                                -->
  <!-- ================================================================= -->
  <rect x="40" y="830" width="1270" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="856" font-size="12" font-weight="800" fill="#0f172a">DFD Level 2 (Process 1.0) Validation Legend:</text>
  <text x="60" y="875" font-size="11" font-weight="600" fill="#475569">Sub-processes: 1.1 Receive Credentials | 1.2 Validate Account Data | 1.3 Create User Session | 1.4 Record Login Log | Pure Noun Phrases</text>
</svg>
