<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 920" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1350" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="675" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="1">DFD LEVEL 2 — PROCESS 6.0: HANDLE RENEWAL REQUESTS</text>
  <text x="675" y="52" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Sub-process Decomposition | Verified Payment Approval &amp; Accounting Link | Pure Noun-Phrase Data Flows</text>

  <!-- ================================================================= -->
  <!-- EXTERNAL ENTITIES (LEFT COLUMN: x=60 to x=240, width=180)         -->
  <!-- ================================================================= -->

  <!-- MEMBER ENTITY (Top-Left: y=90 to y=170) -->
  <g id="entity-member">
    <rect x="60" y="90" width="180" height="80" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="60" y="90" width="180" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <text x="150" y="138" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">MEMBER</text>
    <text x="150" y="156" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">External Entity</text>
  </g>

  <!-- ADMIN ENTITY (Bottom-Left: y=700 to y=780) -->
  <g id="entity-admin">
    <rect x="60" y="700" width="180" height="80" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#card-shadow)"/>
    <rect x="60" y="700" width="180" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <text x="150" y="748" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">ADMIN</text>
    <text x="150" y="766" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">External Entity</text>
  </g>

  <!-- ================================================================= -->
  <!-- SUB-PROCESSES (CENTER COLUMN: x=480 to x=740, Width=260)         -->
  <!-- ================================================================= -->

  <!-- 6.1 Receive Renewal Submission -->
  <g id="subproc-6-1">
    <rect x="480" y="90" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="120" x2="740" y2="120" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">6.1</text>
    <text x="610" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Receive Renewal Submission</text>
  </g>

  <!-- 6.2 Review Renewal Application -->
  <g id="subproc-6-2">
    <rect x="480" y="280" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="310" x2="740" y2="310" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="302" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">6.2</text>
    <text x="610" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Review Renewal Application</text>
  </g>

  <!-- 6.3 Extend Subscription Validity -->
  <g id="subproc-6-3">
    <rect x="480" y="470" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="500" x2="740" y2="500" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="492" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">6.3</text>
    <text x="610" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Extend Subscription Validity</text>
  </g>

  <!-- 6.4 Dispatch Renewal Confirmation -->
  <g id="subproc-6-4">
    <rect x="480" y="700" width="260" height="75" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" filter="url(#card-shadow)"/>
    <line x1="480" y1="730" x2="740" y2="730" stroke="#0f172a" stroke-width="1.5"/>
    <text x="610" y="722" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">6.4</text>
    <text x="610" y="758" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Dispatch Renewal Confirmation</text>
  </g>

  <!-- ================================================================= -->
  <!-- DATA STORES (RIGHT COLUMN: D4, D5, D7)                            -->
  <!-- ================================================================= -->

  <!-- D4 Subscriptions (Read by 6.1) -->
  <g id="ds-d4-top">
    <line x1="980" y1="105" x2="980" y2="150" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="105" x2="1260" y2="105" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="150" x2="1260" y2="150" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="105" x2="1025" y2="150" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="133" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D4</text>
    <text x="1142" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Subscriptions</text>
  </g>

  <!-- D7 Renewal_Requests (Written by 6.1 & 6.3) -->
  <g id="ds-d7">
    <line x1="980" y1="280" x2="980" y2="325" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="280" x2="1260" y2="280" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="325" x2="1260" y2="325" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="280" x2="1025" y2="325" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="308" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D7</text>
    <text x="1142" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Renewal_Requests</text>
  </g>

  <!-- D4 Subscriptions (Written by 6.3) -->
  <g id="ds-d4-bottom">
    <line x1="980" y1="475" x2="980" y2="520" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="475" x2="1260" y2="475" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="520" x2="1260" y2="520" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="475" x2="1025" y2="520" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="503" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D4</text>
    <text x="1142" y="503" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Subscriptions</text>
  </g>

  <!-- D5 Payments (Written by 6.3) -->
  <g id="ds-d5">
    <line x1="980" y1="545" x2="980" y2="590" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="545" x2="1260" y2="545" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="980" y1="590" x2="1260" y2="590" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="1025" y1="545" x2="1025" y2="590" stroke="#0f172a" stroke-width="1.8"/>
    <text x="1002" y="573" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">D5</text>
    <text x="1142" y="573" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Payments</text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT-SIDE DATA FLOWS (ZERO CROSSING DEDICATED LANES)              -->
  <!-- ================================================================= -->

  <!-- 1. MEMBER -> 6.1 (Membership Renewal Request) Direct Horizontal -->
  <line x1="240" y1="115" x2="478" y2="115" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="108" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Membership Renewal Request</text>

  <!-- 2. 6.1 -> ADMIN (Pending Renewal Application Alert) Lane at x=380 -->
  <path d="M 480 145 L 380 145 L 380 725 L 242 725" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="380" y="138" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Pending Renewal Application Alert</text>

  <!-- 3. ADMIN -> 6.2 (Verified Payment & Renewal Approval) Lane at x=190 -->
  <path d="M 190 700 L 190 345 L 478 345" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="339" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Verified Payment &amp; Renewal Approval</text>

  <!-- 4. 6.2 -> MEMBER (Renewal Rejection Notice) Lane at x=330 -->
  <path d="M 480 295 L 330 295 L 330 135 L 242 135" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="380" y="288" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Renewal Rejection Notice</text>

  <!-- 5. 6.4 -> MEMBER (Renewal Approval & Receipt Confirmation) Dedicated Lane at x=280 entering MEMBER at y=155 -->
  <path d="M 480 735 L 280 735 L 280 155 L 242 155" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="162" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Renewal Approval &amp; Receipt Confirmation</text>

  <!-- ================================================================= -->
  <!-- CENTER SUB-PROCESS FLOWS                                          -->
  <!-- ================================================================= -->

  <!-- 6.1 -> 6.2 (Pending Renewal Application) -->
  <line x1="610" y1="165" x2="610" y2="278" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="225" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Pending Renewal Application</text>

  <!-- 6.2 -> 6.3 (Approved Renewal Payload) -->
  <line x1="610" y1="355" x2="610" y2="468" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="415" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Approved Renewal Payload</text>

  <!-- 6.3 -> 6.4 (Renewal Completion Data) -->
  <line x1="610" y1="545" x2="610" y2="698" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="625" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Renewal Completion Data</text>

  <!-- ================================================================= -->
  <!-- RIGHT-SIDE DATA STORE FLOWS (ZERO CROSSING CLEAN BRANCHES)        -->
  <!-- ================================================================= -->

  <!-- D4 -> 6.1 (Subscription Expiration Status) -->
  <line x1="978" y1="128" x2="742" y2="128" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="121" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Subscription Expiration Status</text>

  <!-- 6.1 -> D7 (New Renewal Submission) -->
  <path d="M 740 150 L 850 150 L 850 295 L 978 295" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="860" y="245" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">New Renewal Submission</text>

  <!-- 6.3 -> D7 (Updated Renewal Status) -->
  <path d="M 740 485 L 850 485 L 850 315 L 978 315" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="860" y="445" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Updated Renewal Status</text>

  <!-- 6.3 -> D4 (Subscription Validity Extension) -->
  <line x1="740" y1="500" x2="978" y2="500" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="493" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Subscription Validity Extension</text>

  <!-- 6.3 -> D5 (Renewal Payment Record) -->
  <path d="M 740 530 L 880 530 L 880 568 L 978 568" stroke="#1e293b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="860" y="561" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b" style="paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round;">Renewal Payment Record</text>

  <!-- ================================================================= -->
  <!-- FOOTER LEGEND AND CONVENTIONS NOTE                                -->
  <!-- ================================================================= -->
  <rect x="40" y="830" width="1270" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="856" font-size="12" font-weight="800" fill="#0f172a">DFD Level 2 (Process 6.0) Validation Legend:</text>
  <text x="60" y="875" font-size="11" font-weight="600" fill="#475569">Sub-processes: 6.1 Receive Renewal Submission | 6.2 Review Renewal Application | 6.3 Extend Subscription Validity | 6.4 Dispatch Renewal Confirmation | Data Stores: D4, D5, D7 | Pure Noun Phrases</text>
</svg>
